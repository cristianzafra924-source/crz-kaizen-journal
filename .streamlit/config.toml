[theme]
base = "dark"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0d1117"
textColor = "#e2e8f0"
primaryColor = "#2dd4bf"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
